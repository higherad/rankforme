<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b5bfd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="랭포미">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>랭포미 RankForMe - 순위 조회</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#f3f5f9;--card:#fff;--text:#131722;--sub:#6b7385;--line:#e5e8ef;--pri:#3b5bfd;--pri-soft:#edf0ff;--up:#e5383b;--down:#2f6fed;--ok:#03a65a;--kakao:#fee500;--shadow:0 1px 2px rgba(20,25,40,.06),0 4px 14px rgba(20,25,40,.05);
  --place:#03c75a;--shop:#ff7a00;--blog:#7b61ff}
[data-theme=dark]{--bg:#0e1118;--card:#171b25;--text:#e8ebf2;--sub:#8d95a8;--line:#262c3a;--pri:#6d86ff;--pri-soft:#1e2540;--up:#ff5c5f;--down:#5a8dff;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;font-size:15px;letter-spacing:-.2px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--pri)}
.app{min-height:100dvh}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
header.top h1{font-size:20px;margin:0;flex:1;font-weight:800}
.logo{color:var(--pri)}
.plan-badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--line);color:var(--sub)}
.plan-badge.pro{background:linear-gradient(90deg,#3b5bfd,#a74bff);color:#fff}
.iconbtn{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--text)}
.iconbtn:active{background:var(--line)}
.dot[hidden]{display:none}
.dot{position:absolute;top:5px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--up);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}
main{max-width:760px;margin:0 auto;padding:4px 16px calc(96px + env(safe-area-inset-bottom))}
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;color:var(--sub);font-weight:600}
nav#nav button.on{color:var(--pri)}
nav#nav .brand,nav#nav .subs,nav#nav .car{display:none}
.subbar{margin:0 -16px 12px;padding:0 16px}
details.grp summary{list-style:none;cursor:pointer}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary h3{margin:0}
details.grp[open] summary h3{margin-bottom:8px}
details.grp summary h3:after{content:"▸";color:var(--sub);font-size:13px;margin-left:8px}
details.grp[open] summary h3:after{content:"▾"}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:25;height:52px;padding:0 18px 0 14px;border-radius:26px;background:linear-gradient(135deg,#3b5bfd,#8b5cf6);color:#fff;display:flex;align-items:center;gap:6px;font-weight:700;box-shadow:0 8px 24px rgba(59,91,253,.35)}
@media (min-width:900px){
  nav#nav{top:0;right:auto;width:220px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:18px 12px 12px;gap:2px}
  nav#nav{overflow-y:auto}
  nav#nav .brand{display:block;padding:4px 14px 22px;cursor:pointer}
  nav#nav .car{display:inline;color:var(--sub);font-size:12px}
  nav#nav .subs{display:block;margin:2px 0 8px 25px;padding-left:8px;border-left:1px solid var(--line)}
  nav#nav .sb{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:7px 10px;font-size:14px;color:var(--sub);border-radius:8px;font-weight:500}
  nav#nav .sb.on{color:var(--pri);background:var(--pri-soft);font-weight:700}
  nav#nav .sb i{width:5px;height:5px;border-radius:50%;background:var(--line);flex:none}
  nav#nav .brand b{display:block;font-size:22px;font-weight:800;color:var(--pri)}
  nav#nav .brand span{font-size:12px;color:var(--sub);font-weight:600}
  nav#nav button{flex:none;flex-direction:row;gap:10px;padding:11px 14px;border-radius:12px;font-size:15px;text-align:left}
  nav#nav button.on{background:var(--pri-soft)}
  .app{padding-left:220px}
  header.top{padding-left:24px}
  main{padding-bottom:48px}
  .fab{bottom:28px;right:28px}
}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:6px}
.card h3 .more{margin-left:auto;font-size:13px;color:var(--sub);font-weight:500}
.muted{color:var(--sub)}.small{font-size:13px}.tiny{font-size:11px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.btn{height:44px;padding:0 16px;border-radius:12px;background:var(--pri);color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.sub{background:var(--pri-soft);color:var(--pri)}
.btn.ghost{background:var(--line);color:var(--text)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.input,select.input,textarea.input{width:100%;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none}
textarea.input{height:auto;padding:12px 14px;resize:vertical}
.input:focus{border-color:var(--pri)}
label.lb{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--sub);display:inline-flex;align-items:center;gap:4px}
.chip.on{background:var(--text);color:var(--card);border-color:var(--text)}
.tag{display:inline-block;white-space:nowrap;flex:none;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--line);color:var(--sub)}
.tag.place{background:color-mix(in srgb,var(--place) 15%,transparent);color:var(--place)}
.tag.shop{background:color-mix(in srgb,var(--shop) 15%,transparent);color:var(--shop)}
.tag.blog{background:color-mix(in srgb,var(--blog) 15%,transparent);color:var(--blog)}
.up{color:var(--up);font-weight:700}.down{color:var(--down);font-weight:700}.same{color:var(--sub)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats div{background:var(--bg);border-radius:12px;padding:10px 4px}
.stats b{display:block;font-size:20px}
.stats span{font-size:12px;color:var(--sub)}
.item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin-bottom:8px;cursor:pointer}
.item:active{transform:scale(.99)}
.rk{width:56px;flex:none;text-align:center}
.rk b{font-size:24px;font-weight:800;line-height:1}
.rk small{font-size:12px;color:var(--sub);margin-left:1px}
.rk .out{font-size:13px;color:var(--sub);font-weight:700}
.kw{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.rt{text-align:right;flex:none;font-size:13px}
.list-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row.me{background:var(--pri-soft);margin:0 -10px;padding:11px 10px;border-radius:10px;border:0}
.num{width:26px;font-weight:800;text-align:center;flex:none}
.empty{text-align:center;padding:40px 10px;color:var(--sub)}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{display:none}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s}
.switch span:after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--pri)}
.switch input:checked+span:after{left:21px}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-radius:22px 22px 0 0;max-height:90dvh;overflow:auto;padding:8px 18px calc(20px + env(safe-area-inset-bottom));animation:slide .25s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:19px;margin:4px 0 4px}
@media (min-width:700px){.sheet{left:50%;right:auto;width:560px;transform:translateX(-50%);bottom:auto;top:50%;translate:0 -50%;border-radius:22px;animation:fade .2s}}
@keyframes slide{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:#1c2130;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;max-width:calc(100% - 32px);white-space:pre-line;animation:fade .2s;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.adwrap{position:fixed;inset:0;z-index:90;background:rgba(5,8,15,.85);display:grid;place-items:center;padding:16px;animation:fade .2s}
.adbox{width:100%;max-width:380px;background:var(--card);border-radius:20px;overflow:hidden;text-align:center}
.adimg{height:260px;display:grid;place-items:center;background:linear-gradient(135deg,#ffcf5c,#ff7a59);color:#fff;font-size:22px;font-weight:800;position:relative;padding:20px}
.adimg .adtag{position:absolute;top:10px;left:10px;font-size:11px;background:rgba(0,0,0,.35);padding:2px 7px;border-radius:5px}
.adbox .in{padding:16px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:10px 0 14px}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width 1s linear}
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:150px}
.msg{max-width:86%;overflow-wrap:anywhere;padding:11px 14px;border-radius:18px;line-height:1.55;font-size:14.5px;white-space:pre-line}
.msg.me{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.msg.bot .btn{margin-top:8px}
.composer{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:24;background:var(--bg);padding:8px 16px 10px;border-top:1px solid var(--line)}
@media (min-width:900px){.composer{left:220px;bottom:0}}
.composer .in{max-width:760px;margin:0 auto}
.kakao{background:#b2c7da;border-radius:14px;padding:12px}
.kakao .bub{background:#fff;border-radius:12px;overflow:hidden;color:#111;font-size:13.5px;max-width:270px}
.kakao .bub .h{background:var(--kakao);padding:9px 12px;font-weight:800}
.kakao .bub .b{padding:12px;white-space:pre-line;line-height:1.55}
.sms{background:#e9e9eb;color:#111;border-radius:16px;padding:10px 13px;font-size:13.5px;white-space:pre-line;max-width:270px;line-height:1.5}
.sched{display:flex;gap:12px;align-items:flex-start}
.sched .t{font-size:22px;font-weight:800;line-height:1.2}
.menu-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.menu-row:last-child{border-bottom:0}
.listlink{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-weight:600}
.listlink:last-child{border-bottom:0}
.listlink .ico{width:34px;height:34px;border-radius:10px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;flex:none}
table.plan{width:100%;border-collapse:collapse;font-size:13px}
table.plan th,table.plan td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:center}
table.plan td:first-child,table.plan th:first-child{text-align:left;color:var(--sub)}
.tw{overflow-x:auto;margin:0 -2px}
.dtable{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.dtable th{color:var(--sub);font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);font-size:12px}
.dtable td{padding:10px 8px;border-bottom:1px solid var(--line)}
.dtable tr:last-child td{border-bottom:0}
.bar2{display:inline-block;width:90px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;vertical-align:middle}
.bar2 i{display:block;height:100%;border-radius:3px}
.spec h4{margin:18px 0 6px;font-size:15px}
.spec ul{margin:0;padding-left:18px;line-height:1.7;font-size:14px}
.spec code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:12px}
.typing span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--sub);animation:bl 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes bl{50%{opacity:.25}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 id="title"></h1>
    <span id="planBadge" class="plan-badge" onclick="go('plan')"></span>
    <button class="iconbtn" onclick="go('alert','inbox')" aria-label="알림함"><span id="bellIco"></span><span id="bellDot" class="dot" hidden></span></button>
  </header>
  <main id="main"></main>
</div>
<nav id="nav"></nav>
<button id="fab" class="fab" onclick="go('ai')"><span id="fabIco"></span>AI 활용하기</button>

<script>
/* ===== 기본 정의 ===== */
const TYPES={
  place:{t:'플레이스',tg:'업체명',max:300,unit:'플레이스 URL 또는 MID'},
  shop:{t:'쇼핑',tg:'상품명',max:400,unit:'스마트스토어/카탈로그 URL'},
  blog:{t:'블로그',tg:'글 제목',max:100,unit:'블로그 글 URL'}};
const DAYS=['일','월','화','수','목','금','토'];
const IC={
  home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  pin:'<path d="M12 22s7-7.5 7-13a7 7 0 0 0-14 0c0 5.5 7 13 7 13z"/><circle cx="12" cy="9" r="2.5"/>',
  cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h9.6a1 1 0 0 0 1-.8L21 7H6"/>',
  doc:'<path d="M6 2h9l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><path d="M14 2v6h6M8 13h8M8 17h6"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/>',
  spark:'<path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>',
  star:'<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4 6.5 20.3l1-6.2L3 9.7l6.2-.9z"/>',
  send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  moon:'<path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/>',
  phone:'<rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/>',
  file:'<path d="M4 4h16v16H4z"/><path d="M4 9h16M9 4v16"/>',
  crown:'<path d="M3 7l4 4 5-7 5 7 4-4-2 12H5z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.9.7c0 1.7-2.4 2.3-2.4 3.8M12 17h.01"/>',
  book:'<path d="M4 4a2 2 0 0 1 2-2h14v18H6a2 2 0 0 0-2 2z"/><path d="M4 22V4"/>',
  share:'<circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/>'};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=n=>Number(n).toLocaleString('ko-KR');
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};

/* ===== 데모 데이터 ===== */
let sd=11;const rnd=()=>(sd=sd*16807%2147483647)/2147483647;
function hist(end,max){ // end에서 거꾸로 30일 랜덤워크
  const h=[end];let r=end??max;
  for(let i=0;i<29;i++){r=Math.max(1,Math.min(max,Math.round(r+(rnd()-.45)*Math.max(2,r/5))));h.unshift(r)}
  return h}
function mkItem(type,keyword,name,mid,rank,group='기본'){
  const v=hash(keyword);
  return {id:uid(),type,keyword,name,mid:String(mid),group,fav:false,memo:'',volume:(v%60+2)*730,
    reviews:v%3000+120,saves:v%9000+300,price:(v%90+9)*1000,history:hist(rank,TYPES[type].max),created:Date.now()}}
function seed(){
  sd=11;
  const it=[
    mkItem('place','강남 맛집','홍길동 숯불갈비',1938472610,4,'내 매장'),
    mkItem('place','강남역 고기집','홍길동 숯불갈비',1938472610,2,'내 매장'),
    mkItem('place','역삼 회식','홍길동 숯불갈비',1938472610,11,'내 매장'),
    mkItem('place','신논현 파스타','라구앤코',1284759301,7,'광고주A'),
    mkItem('place','강남 네일','네일하우스 강남점',1102938475,null,'광고주B'),
    mkItem('shop','캠핑의자','하이어 경량 캠핑의자',8837261540,23,'내 스토어'),
    mkItem('shop','접이식 테이블','하이어 폴딩테이블',8837261777,5,'내 스토어'),
    mkItem('shop','무선 청소기','클린맥스 V8',8912003311,64,'광고주A'),
    mkItem('blog','강남 맛집 추천','강남역 고기 맛집 BEST 5 솔직후기',223619870012,3,'체험단'),

const POOL={

function fakeRank(type,kw,name){const h=hash(type+kw+name);return h%10===0?null:h%Math.min(60,TYPES[type].max)+1}
function topList(it,n=10){
  const p=POOL[it.type],h=hash(it.keyword),r=cur(it),out=[];let j=0;
  for(let i=1;i<=n;i++){
    if(i===r){out.push({me:true,name:it.name,rank:i,meta:meta(it,it)});continue}
    const nm=it.type==='blog'?`${it.keyword} ${p[(h+j)%p.length]}`:p[(h+j)%p.length];j++;
    const o={keyword:it.keyword+i,type:it.type};out.push({name:nm,rank:i,meta:meta(it,{...mkMeta(o)})})}
  return out}
function mkMeta(o){const v=hash(o.keyword);return {reviews:v%4000+200,saves:v%12000+500,price:(v%90+9)*1000,keyword:o.keyword}}
function meta(it,o){
  if(it.type==='place')return `방문자리뷰 ${fmtN(o.reviews)} · 저장 ${fmtN(o.saves)}`;
  if(it.type==='shop')return `${fmtN(o.price)}원 · 리뷰 ${fmtN(o.reviews)}`;
  return `blog.naver.com · 공감 ${o.reviews%300}`}

function spark(h,w=84,ht=30){
  const vals=h.map(v=>v??Math.max(...h.filter(x=>x!=null),1)+5),lo=Math.min(...vals),hi=Math.max(...vals);
  const pts=vals.map((v,i)=>`${(i*(w/(vals.length-1))).toFixed(1)},${(hi===lo?ht/2:(v-lo)/(hi-lo)*(ht-4)+2).toFixed(1)}`).join(' ');
  const d=vals.at(-2)-vals.at(-1),c=d>0?'var(--up)':d<0?'var(--down)':'var(--sub)';
  return `<svg width="${w}" height="${ht}" viewBox="0 0 ${w} ${ht}"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round"/></svg>`}

function chart(it){
  const h=it.history,W=320,H=150,P=28,vals=h.map(v=>v??null),nn=vals.filter(v=>v!=null);
  if(!nn.length)return '<div class="empty">최근 30일 순위 기록이 없어요</div>';
  const lo=Math.min(...nn),hi=Math.max(...nn,lo+1);
  const x=i=>P+i*((W-P-8)/(h.length-1)),y=v=>10+(v-lo)/(hi-lo)*(H-34);
  let path='',pen=false;vals.forEach((v,i)=>{if(v==null){pen=false;return}path+=(pen?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1);pen=true});
  const dt=i=>{const d=new Date();d.setDate(d.getDate()-(h.length-1-i));return (d.getMonth()+1)+'/'+d.getDate()};
  const last=vals.at(-1);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
    ${[lo,Math.round((lo+hi)/2),hi].map(v=>`<line x1="${P}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P-6}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="var(--sub)">${v}위</text>`).join('')}
    <path d="${path}" fill="none" stroke="var(--pri)" stroke-width="2.2" stroke-linejoin="round"/>
    ${last!=null?`<circle cx="${x(h.length-1)}" cy="${y(last)}" r="4.5" fill="var(--pri)" stroke="var(--card)" stroke-width="2"/>`:''}
    ${[0,14,29].map(i=>`<text x="${x(i)}" y="${H-4}" font-size="10" text-anchor="middle" fill="var(--sub)">${dt(i)}</text>`).join('')}</svg>`}

function itemCard(it){

/* --- CSV --- */
function exportCsv(type){
  const rows=[['유형','키워드','대상','MID','그룹','현재순위','어제순위','월검색량','메모'],...S.items.filter(i=>!type||i.type===type).map(i=>[TYPES[i.type].t,i.keyword,i.name,i.mid,i.group,cur(i)??'순위밖',prv(i)??'순위밖',i.volume,i.memo])];
  const csv='﻿'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`순위_${new Date().toISOString().slice(0,10)}.csv`;a.click()}
function importCsv(){
  const f=document.createElement('input');f.type='file';f.accept='.csv,.txt';
  f.onchange=async()=>{const txt=await f.files[0].text(),map={'플레이스':'place','쇼핑':'shop','블로그':'blog',place:'place',shop:'shop',blog:'blog'};
    const add=[];txt.replace(/^﻿/,'').split(/\r?\n/).forEach(l=>{const c=l.split(',').map(s=>s.replace(/^"|"$/g,'').trim());const t=map[c[0]];if(t&&c[1]&&c[2])add.push(mkItem(t,c[1],c[2],c[3]||String(hash(c[2])).slice(0,10),fakeRank(t,c[1],c[2]),c[4]||'기본'))});
    if(!add.length)return toast('형식: 유형,키워드,대상,MID,그룹 (예: 플레이스,강남 맛집,홍길동식당,1234,내 매장)');
    S.items.unshift(...add);render();toast(add.length+'개 일괄 등록 완료')};
  f.click()}

/* --- 알림 예약 --- */
const COND={always:'매번 보내기',change:'순위가 바뀌었을 때만',drop:'순위가 떨어졌을 때만',out:'N위 밖으로 밀렸을 때만'};
const chLabel=s=>[s.ch.push&&'앱 알림',s.ch.kakao&&'카카오톡',s.ch.sms&&'문자'].filter(Boolean);
function targets(s){return S.items.filter(i=>s.ids.length?s.ids.includes(i.id):(s.type==='all'||i.type===s.type))}
function passCond(s,it){const d=delta(it),r=cur(it);return s.cond==='always'||(s.cond==='change'&&d!==0)||(s.cond==='drop'&&d<0)||(s.cond==='out'&&(r==null||r>s.th))}
const msgLine=it=>`${it.keyword} | ${it.name} | ${fmtRank(cur(it))} ${dTxt(delta(it))}`;
function msgFor(s){const p=targets(s).filter(i=>passCond(s,i));return p.length?p.map(msgLine).join('\n'):null}
function nextFire(){
  const now=new Date();let best=null;
  S.schedules.filter(s=>s.on).forEach(s=>{for(let a=0;a<8;a++){const d=new Date(now);d.setDate(d.getDate()+a);if(!s.days.includes(d.getDay()))continue;
    s.times.forEach(t=>{const [h,m]=t.split(':');const x=new Date(d);x.setHours(+h,+m,0,0);if(x>now&&(!best||x<best.at))best={at:x,s,time:t,label:a===0?'오늘':a===1?'내일':DAYS[x.getDay()]+'요일'}})}});
  return best}
function fire(s,test){
  const body=msgFor(s);
  if(!body){if(test)toast('지금은 조건에 맞는 변동이 없어서 발송되지 않아요');return}
  const n=body.split('\n').length,title=`[${s.name}] ${n}건`;
  S.inbox.unshift({id:uid(),ts:Date.now(),title,body,ch:chLabel(s).map(c=>c.replace(' 알림','')),read:false});S.inbox=S.inbox.slice(0,100);
  if(s.ch.push&&'Notification' in window&&Notification.permission==='granted'){
    navigator.serviceWorker?.getRegistration().then(r=>r?r.showNotification(title,{body,icon:'icon-192.png'}):new Notification(title,{body}))}
  toast(`🔔 ${title}\n${body.split('\n').slice(0,3).join('\n')}${n>3?'\n…':''}`);render()}
function tick(){const d=new Date(),hm=pad(d.getHours())+':'+pad(d.getMinutes()),k=d.toDateString()+hm;
  S.schedules.forEach(s=>{if(s.on&&s.days.includes(d.getDay())&&s.times.includes(hm)&&s.last!==k){s.last=k;fire(s)}})}
setInterval(tick,15000);

function connCh(k,inp){const v=$('#'+inp).value.replace(/[^0-9]/g,'');if(!/^01\d{8,9}$/.test(v))return toast('휴대폰 번호를 확인해주세요');
  const code=prompt('인증번호 6자리를 입력하세요 (데모: 아무 숫자)');if(!code)return;S.ch[k]=v.replace(/(\d{3})(\d{3,4})(\d{4})/,'$1-$2-$3');render();toast('연결됐어요')}
function reqPush(){if(!('Notification' in window))return toast('이 브라우저는 알림을 지원하지 않아요');
  Notification.requestPermission().then(p=>{S.ch.push=p==='granted';render();toast(p==='granted'?'앱 알림이 켜졌어요':'알림이 허용되지 않았어요')})}

const NAMES={place:['홍길동 숯불갈비','라구앤코','봄날 브런치','청담 스시오마카세','성수 베이커리'],shop:['하이어 경량 캠핑의자','하이어 폴딩테이블','데일리 텀블러 500ml'],blog:['내돈내산 후기 포스팅','방문 후기 포스팅']};
function parseUrl(t){
  let m;const pick=(type,mid)=>({type,typeName:TYPES[type].t,mid,name:NAMES[type][hash(mid)%NAMES[type].length]});
  if(m=t.match(/(?:place\.naver\.com\/(?:\w+\/)?|map\.naver\.com\/\S*?place\/)(\d{5,})/))return pick('place',m[1]);
  if(m=t.match(/(?:smartstore|brand)\.naver\.com\/[\w-]+\/products\/(\d+)|shopping\.naver\.com\/\S*?catalog\/(\d+)/))return pick('shop',m[1]||m[2]);
  if(m=t.match(/blog\.naver\.com\/([\w-]+)\/(\d+)/))return pick('blog',m[2]);
  if(/^\d{7,}$/.test(t.trim()))return pick('place',t.trim());
  return null}
const SUGG=['강남 맛집 몇 위야?','어제보다 떨어진 키워드 알려줘','오늘 순위 요약해줘','평일 오전 9시에 카톡으로 플레이스 순위 보내줘','강남 키워드 추천해줘','https://m.place.naver.com/restaurant/1938472610 역삼 맛집, 선릉 회식 등록해줘'];

function aiSend(t){
  t=(t||'').trim();if(!t)return;
  S.chat.push({me:true,h:esc(t)});render();
  const c=$('#chat');const ty=document.createElement('div');ty.className='msg bot typing';ty.innerHTML='<span></span><span></span><span></span>';c.append(ty);scrollChat();
  setTimeout(()=>{S.chat.push({me:false,h:aiReply(t)});S.chat=S.chat.slice(-60);if(route==='ai')render()},550)}
const STOP=new Set(['등록','등록해줘','등록해주세요','추가','추가해줘','해줘','키워드','키워드로','로','으로','추적','추적해줘','부탁해','부탁해요','이걸','이거']);
let RECO=[];
function aiReply(t){
  const u=parseUrl(t),q=[...t.matchAll(/['"“”‘’]([^'"“”‘’]+)['"“”‘’]/g)].map(m=>m[1].trim());
  if(u){
    const rest=t.replace(/https?:\/\/\S+/g,'').split(/\s+/).filter(w=>w&&!STOP.has(w)).join(' ');
    const kws=q.length?q:rest.split(/[,\n]/).map(s=>s.trim()).filter(s=>s.length>1);
    if(!kws.length){S.pending=u;return `${u.typeName} <b>${esc(u.name)}</b> (MID ${u.mid})을 찾았어요.\n어떤 키워드로 순위를 추적할까요? 쉼표로 여러 개 입력할 수 있어요.`}
    return register(u,kws)}
  if(S.pending&&!/[?？]|몇|알려|요약|추천/.test(t)){const p=S.pending;S.pending=null;return register(p,(q.length?q:t.split(/[,\n]/)).map(s=>s.trim()).filter(Boolean))}
  const sq=t.replace(/\s/g,''),hit=S.items.filter(i=>sq.includes(i.keyword.replace(/\s/g,''))||sq.includes(i.name.replace(/\s/g,'')));
  if(/알림|보내줘|알려줘/.test(t)&&/(\d{1,2})\s*시|시간\s*마다/.test(t))return makeSchedule(t,hit);
  if(/추천/.test(t))return recommend(t,hit);
  if(hit.length)return hit.map(i=>`<b>${esc(i.keyword)}</b> · ${esc(i.name)}\n→ <b>${fmtRank(cur(i))}</b> ${dHtml(delta(i))}  (월 검색 ${fmtN(i.volume)})`).join('\n\n')+`\n\n<button class="btn sub sm" onclick="openItem('${hit[0].id}')">상세 · 그래프 보기</button>`;
  if(/떨어|하락|내려/.test(t)){const d=S.items.filter(i=>delta(i)<0);return d.length?`어제보다 떨어진 키워드 ${d.length}개예요.\n\n`+d.map(i=>`• ${esc(i.keyword)} (${esc(i.name)}) ${fmtRank(cur(i))} ${dHtml(delta(i))}`).join('\n')+`\n\n하락할 때 바로 알림을 받아볼까요? "떨어지면 12시, 18시에 알려줘"라고 말해보세요.`:'떨어진 키워드가 없어요 👍'}
  if(/오른|상승|올라/.test(t)){const d=S.items.filter(i=>delta(i)>0);return d.length?`어제보다 오른 키워드 ${d.length}개예요 🎉\n\n`+d.map(i=>`• ${esc(i.keyword)} ${fmtRank(cur(i))} ${dHtml(delta(i))}`).join('\n'):'오른 키워드가 없어요'}
  if(/1페이지|상위|10위|top/i.test(t)){const d=S.items.filter(i=>cur(i)!=null&&cur(i)<=10);return `10위 안 키워드 ${d.length}개:\n`+d.map(i=>`• ${esc(i.keyword)} ${cur(i)}위`).join('\n')}
  if(/요약|현황|어때|정리|브리핑/.test(t)){const it=S.items,b=k=>it.filter(i=>i.type===k);
    return `📊 오늘 순위 요약\n\n`+Object.entries(TYPES).map(([k,v])=>{const a=b(k);return `<b>${v.t}</b> ${a.length}개 · 상승 ${a.filter(i=>delta(i)>0).length} · 하락 ${a.filter(i=>delta(i)<0).length} · 순위 밖 ${a.filter(i=>cur(i)==null).length}`}).join('\n')+
    `\n\n가장 많이 오른 키워드: ${(()=>{const x=[...it].sort((a,b)=>delta(b)-delta(a))[0];return x&&delta(x)>0?`${esc(x.keyword)} ${dHtml(delta(x))}`:'없음'})()}`}
  if(/등록|추가/.test(t))return '등록할 <b>플레이스·스마트스토어·블로그 URL</b>을 키워드와 함께 보내주세요.\n예) https://m.place.naver.com/restaurant/1234567 강남 맛집, 역삼 맛집';
  if(/광고|무료|요금|가격|pro|결제/i.test(t))return `무료는 조회할 때 5초 광고 후 결과를 보여드려요. PRO(월 9,900원)는 광고 없이 카톡·문자 알림까지 쓸 수 있어요.\n<button class="btn sub sm" onclick="go('plan')">요금제 보기</button>`;
  if(/엑셀|csv|일괄|대량/i.test(t))return '각 목록 화면 아래 <b>엑셀 일괄 등록</b>에서 CSV(유형,키워드,대상,MID,그룹)를 올리면 한 번에 등록돼요.';
  return `제가 할 수 있는 일이에요:\n• URL 붙여넣고 등록 — "링크 + 키워드"\n• 순위 질문 — "캠핑의자 몇 위야?"\n• 변동 확인 — "떨어진 키워드 알려줘"\n• 알림 예약 — "평일 9시, 18시에 카톡으로 보내줘"\n• 키워드 추천 — "강남 키워드 추천해줘"`}
function register(u,kws){
  const add=kws.map(k=>mkItem(u.type,k,u.name,u.mid,fakeRank(u.type,k,u.name)));S.items.unshift(...add);
  return `✅ ${u.typeName} <b>${esc(u.name)}</b> 등록 완료\n`+add.map(i=>`• ${esc(i.keyword)}`).join('\n')+`\n\n오늘부터 매일 자동으로 순위를 기록해요.\n<button class="btn sm" onclick="gate(()=>showResult(S.items.find(i=>i.id==='${add[0].id}'),false))">지금 순위 확인하기</button>`}
function makeSchedule(t,hit){
  let times=[];const ev=t.match(/(\d+)\s*시간\s*마다/);
  if(ev)for(let h=9;h<=21;h+=+ev[1])times.push(pad(h)+':00');
  else for(const m of t.matchAll(/(오전|오후|저녁|밤)?\s*(\d{1,2})\s*시\s*(?:(\d{1,2})\s*분|(반))?/g)){let h=+m[2];if(/오후|저녁|밤/.test(m[1]||'')&&h<12)h+=12;if(h<24)times.push(pad(h)+':'+(m[3]?pad(m[3]):m[4]?'30':'00'))}
  times=[...new Set(times)].sort();
  const days=/평일/.test(t)?[1,2,3,4,5]:/주말/.test(t)?[0,6]:[0,1,2,3,4,5,6];
  const th=t.match(/(\d+)\s*위\s*(밖|아래|이하|밑)/);
  const cond=th?'out':/떨어|하락/.test(t)?'drop':/변동|바뀌|변하/.test(t)?'change':'always';
  const type=/플레이스/.test(t)?'place':/쇼핑|스토어/.test(t)?'shop':/블로그/.test(t)?'blog':'all';
  const ch={push:true,kakao:/카톡|카카오/.test(t),sms:/문자|sms/i.test(t)};
  const s={id:uid(),name:hit.length?hit[0].keyword+' 알림':(type==='all'?'순위':TYPES[type].t)+' 알림',type:hit.length?'all':type,ids:hit.map(i=>i.id),times,days,cond,th:th?+th[1]:10,ch,on:true};
  S.schedules.push(s);
  const miss=['kakao','sms'].filter(k=>ch[k]&&!S.ch[k]);
  return `⏰ 알림을 예약했어요\n\n• 시간: ${times.join(', ')} (${days.length===7?'매일':days.length===5?'평일':'주말'})\n• 대상: ${hit.length?hit.map(i=>esc(i.keyword)).join(', '):(type==='all'?'전체 키워드':TYPES[type].t)}\n• 조건: ${cond==='out'?s.th+'위 밖으로 밀리면':COND[cond]}\n• 받는 곳: ${chLabel(s).join(', ')}\n\n미리보기:\n<span class="small muted">${esc(msgFor(s)||'(현재는 조건에 맞는 변동 없음)').split('\n').slice(0,3).join('\n')}</span>`+
    (miss.length?`\n\n⚠️ ${miss.map(k=>k==='kakao'?'카카오톡':'문자').join('·')} 번호가 아직 연결되지 않았어요.\n<button class="btn sm" onclick="go('channels')">받는 곳 연결하기</button>`:`\n<button class="btn sub sm" onclick="go('alert')">알림 예약 보기</button>`)}
function recommend(t,hit){
  const base=hit[0]||S.items.find(i=>i.type==='place'),word=(t.match(/([가-힣]+?)(?:\s*(?:키워드|지역))?\s*(?:관련\s*)?추천/)||[])[1];
  const region=(word&&!/키워드|추천/.test(word)?word:null)||(base?base.keyword.split(' ')[0]:'강남');
  const suf=['맛집','데이트','회식','점심','술집','가볼만한곳','브런치','고기집'];
  RECO=suf.map(s=>({kw:region+' '+s,vol:(hash(region+s)%80+3)*610,comp:['낮음','보통','높음'][hash(s+region)%3]})).sort((a,b)=>b.vol-a.vol).slice(0,6);
  return `🔎 <b>${esc(region)}</b> 연관 키워드 추천 (월 검색량순)\n\n`+RECO.map((r,i)=>`${i+1}. ${esc(r.kw)} · ${fmtN(r.vol)}회 · 경쟁 ${r.comp}`).join('\n')+
    (base?`\n\n<b>${esc(base.name)}</b>로 추적할 키워드를 눌러보세요:\n`+RECO.map((r,i)=>`<button class="chip" style="margin:3px 2px 0 0" onclick="addReco(${i},'${base.id}',this)">+ ${esc(r.kw)}</button>`).join(''):'')}
function addReco(i,bid,el){const b=S.items.find(x=>x.id===bid),r=RECO[i];if(!b||!r)return;
  S.items.unshift(mkItem(b.type,r.kw,b.name,b.mid,fakeRank(b.type,r.kw,b.name),b.group));el.disabled=true;el.textContent='✓ '+r.kw;toast(r.kw+' 추적 시작')}

/* --- 기획 전달하기: 메뉴별 기획을 여러 사람이 남기고 모두가 보는 공용 게시판 ---
   Firebase RTDB rfm/notes/{메뉴키}/{push id} = {a:이름, t:내용, ts}. 규칙: 누구나 읽기·새 글만(수정·삭제 불가), 이름 30자·내용 3000자 */
const NOTE_DB='https://higherad-b9d62-default-rtdb.asia-southeast1.firebasedatabase.app';
const NOTE_MAX=3000;
async function noteFetch(path,opt){
  const r=await fetch(`${NOTE_DB}/rfm/notes${path?'/'+path:''}.json`,opt);
  if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
const noteRows=o=>Object.entries(o||{}).map(([id,v])=>({id,...v})).sort((a,b)=>b.ts-a.ts);
const noteHtml=n=>`<div class="list-row" style="display:block"><div class="row"><b class="grow small">${esc(n.a)}</b><span class="tiny muted">${new Date(n.ts).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div>
  <div class="small" style="white-space:pre-line;margin-top:6px;line-height:1.6">${esc(n.t)}</div></div>`;
async function loadNotes(k){
  const el=$('#nList');if(!el)return;
  try{const rows=noteRows(await noteFetch(k));if(!$('#nList'))return;
    $('#nCount').textContent=rows.length?rows.length+'건':'';
    el.innerHTML=rows.length?rows.map(noteHtml).join(''):'<div class="small muted">아직 전달된 기획이 없어요. 첫 의견을 남겨주세요.</div>'}
  catch(e){el.innerHTML='<div class="small" style="color:var(--up)">기획을 불러오지 못했어요. 새로고침해 주세요.</div>'}}
async function sendNote(k){
  const a=$('#nAuthor').value.trim(),t=$('#nBody').value.trim(),btn=$('#nSend');
  if(!a)return toast('이름을 입력해주세요');
  if(!t)return toast('기획 내용을 입력해주세요');
  if(t.length>NOTE_MAX)return toast(`내용은 ${fmtN(NOTE_MAX)}자까지 저장돼요`);
  S.author=a;btn.disabled=true;
  try{await noteFetch(k,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a:a.slice(0,30),t,ts:Date.now()})});
    $('#nBody').value='';toast('저장했어요. 모두에게 보여요.');loadNotes(k)}
  catch(e){toast('저장하지 못했어요. 잠시 후 다시 눌러주세요.')}
  btn.disabled=false}
/* 메뉴 화면 공통 헤더: 그룹·상태 태그, 제목, 설명, 참고 사이트 */
/* 아직 전체가 구상 단계라 모든 메뉴를 '기획 중'으로 표시 */

/* 전달된 기획 모아보기 (작업용) */
function renderNotes(){
  setTimeout(async()=>{const el=$('#allNotes');
    try{const all=await noteFetch('');if(route!=='notes')return;
      const html=TREE.map(g=>{const rows=g.items.map(it=>({it,rows:noteRows(all?.[it.k])})).filter(x=>x.rows.length);
        return rows.length?`<div class="card"><h3>${ic(g.i,18)} ${g.g}</h3>${rows.map(x=>`<div style="margin-bottom:10px"><button class="listlink" style="border:0;padding:6px 0" onclick="go('m','${x.it.k}')"><span class="grow">${x.it.t}</span><span class="tag">${x.rows.length}건</span><span class="muted">›</span></button>${x.rows.map(noteHtml).join('')}</div>`).join('')}</div>`:''}).join('');
      el.innerHTML=html||'<div class="empty">아직 전달된 기획이 없어요</div>'}
    catch(e){el.innerHTML='<div class="empty" style="color:var(--up)">기획을 불러오지 못했어요. 새로고침해 주세요.</div>'}});

async function copyNotes(){
  try{const all=await noteFetch('')||{};
    const txt=TREE.map(g=>{const rows=g.items.filter(it=>all[it.k]).map(it=>`### ${it.t}\n`+noteRows(all[it.k]).map(n=>`- (${n.a}, ${new Date(n.ts).toLocaleDateString('ko-KR')}) ${n.t.replace(/\n/g,'\n  ')}`).join('\n'));return rows.length?`## ${g.g}\n${rows.join('\n\n')}`:''}).filter(Boolean).join('\n\n');
    if(!txt)return toast('아직 전달된 기획이 없어요');
    await navigator.clipboard.writeText('# 랭포미 메뉴별 전달된 기획\n\n'+txt);toast('전달된 기획을 모두 복사했어요')}
