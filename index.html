<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b5bfd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="랭포미">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>랭포미 RankForMe - 순위 조회</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#f3f5f9;--card:#fff;--text:#131722;--sub:#6b7385;--line:#e5e8ef;--pri:#3b5bfd;--pri-soft:#edf0ff;--up:#e5383b;--down:#2f6fed;--ok:#03a65a;--kakao:#fee500;--shadow:0 1px 2px rgba(20,25,40,.06),0 4px 14px rgba(20,25,40,.05);
  --place:#03c75a;--shop:#ff7a00;--blog:#7b61ff}
[data-theme=dark]{--bg:#0e1118;--card:#171b25;--text:#e8ebf2;--sub:#8d95a8;--line:#262c3a;--pri:#6d86ff;--pri-soft:#1e2540;--up:#ff5c5f;--down:#5a8dff;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;font-size:15px;letter-spacing:-.2px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--pri)}
.app{min-height:100dvh}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
header.top h1{font-size:20px;margin:0;flex:1;font-weight:800}
.logo{color:var(--pri)}
.plan-badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--line);color:var(--sub)}
.plan-badge{cursor:pointer}.plan-badge:hover{filter:brightness(.93)}
.plan-badge.pro{background:linear-gradient(90deg,#3b5bfd,#a74bff);color:#fff}
.iconbtn{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--text)}
.iconbtn:active{background:var(--line)}
.dot[hidden]{display:none}
.dot{position:absolute;top:5px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--up);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}
main{max-width:760px;margin:0 auto;padding:4px 16px calc(96px + env(safe-area-inset-bottom))}
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;color:var(--sub);font-weight:600}
nav#nav button.on{color:var(--pri)}
nav#nav .brand,nav#nav .subs,nav#nav .car{display:none}
.subtabs{position:sticky;top:calc(60px + env(safe-area-inset-top));z-index:15;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:0 10px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;padding:12px 10px 10px;font-size:14.5px;font-weight:600;color:var(--sub);border-bottom:2.5px solid transparent;white-space:nowrap}
.subtabs button.on{color:var(--text);font-weight:800;border-bottom-color:var(--pri)}
details.grp summary{list-style:none;cursor:pointer}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary h3{margin:0}
details.grp[open] summary h3{margin-bottom:8px}
details.grp summary h3:after{content:"▸";color:var(--sub);font-size:13px;margin-left:8px}
details.grp[open] summary h3:after{content:"▾"}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:25;height:52px;padding:0 18px 0 14px;border-radius:26px;background:linear-gradient(135deg,#3b5bfd,#8b5cf6);color:#fff;display:flex;align-items:center;gap:6px;font-weight:700;box-shadow:0 8px 24px rgba(59,91,253,.35)}
/* PC도 모바일과 같은 하단 탭(넓은 화면은 탭 최대 7개 + 설정, 가운데 정렬) */
@media (min-width:900px){
  nav#nav{justify-content:center}
  nav#nav button{flex:0 1 112px}
  header.top{padding-left:max(16px,calc(50% - 380px));padding-right:max(16px,calc(50% - 380px))}
  .fab{right:max(16px,calc(50% - 470px))}
}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:6px}
.card h3 .more{margin-left:auto;font-size:13px;color:var(--sub);font-weight:500}
.muted{color:var(--sub)}.small{font-size:13px}.tiny{font-size:11px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.btn{height:44px;padding:0 16px;border-radius:12px;background:var(--pri);color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.sub{background:var(--pri-soft);color:var(--pri)}
.btn.ghost{background:var(--line);color:var(--text)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.input,select.input,textarea.input{width:100%;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none}
textarea.input{height:auto;padding:12px 14px;resize:vertical}
.input:focus{border-color:var(--pri)}
label.lb{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--sub);display:inline-flex;align-items:center;gap:4px}
.chip.on{background:var(--text);color:var(--card);border-color:var(--text)}
.tag{display:inline-block;white-space:nowrap;flex:none;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--line);color:var(--sub)}
.tag.place{background:color-mix(in srgb,var(--place) 15%,transparent);color:var(--place)}
.tag.shop{background:color-mix(in srgb,var(--shop) 15%,transparent);color:var(--shop)}
.tag.blog{background:color-mix(in srgb,var(--blog) 15%,transparent);color:var(--blog)}
.up{color:var(--up);font-weight:700}.down{color:var(--down);font-weight:700}.same{color:var(--sub)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats div{background:var(--bg);border-radius:12px;padding:10px 4px}
.stats b{display:block;font-size:20px}
.stats span{font-size:12px;color:var(--sub)}
.item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin-bottom:8px;cursor:pointer}
.item:active{transform:scale(.99)}
.rk{width:56px;flex:none;text-align:center}
.rk b{font-size:24px;font-weight:800;line-height:1}
.rk small{font-size:12px;color:var(--sub);margin-left:1px}
.rk .out{font-size:13px;color:var(--sub);font-weight:700}
.kw{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.rt{text-align:right;flex:none;font-size:13px}
.list-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row.me{background:var(--pri-soft);margin:0 -10px;padding:11px 10px;border-radius:10px;border:0}
.num{width:26px;font-weight:800;text-align:center;flex:none}
.empty{text-align:center;padding:40px 10px;color:var(--sub)}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{display:none}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s}
.switch span:after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--pri)}
.switch input:checked+span:after{left:21px}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-radius:22px 22px 0 0;max-height:90dvh;overflow:auto;padding:8px 18px calc(20px + env(safe-area-inset-bottom));animation:slide .25s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:19px;margin:4px 0 4px}
@media (min-width:700px){.sheet{left:50%;right:auto;width:560px;transform:translateX(-50%);bottom:auto;top:50%;translate:0 -50%;border-radius:22px;animation:fade .2s}}
@keyframes slide{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:#1c2130;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;max-width:calc(100% - 32px);white-space:pre-line;animation:fade .2s;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.adwrap{position:fixed;inset:0;z-index:90;background:rgba(5,8,15,.85);display:grid;place-items:center;padding:16px;animation:fade .2s}
.adbox{width:100%;max-width:380px;background:var(--card);border-radius:20px;overflow:hidden;text-align:center}
.adimg{height:260px;display:grid;place-items:center;background:linear-gradient(135deg,#ffcf5c,#ff7a59);color:#fff;font-size:22px;font-weight:800;position:relative;padding:20px}
.adimg .adtag{position:absolute;top:10px;left:10px;font-size:11px;background:rgba(0,0,0,.35);padding:2px 7px;border-radius:5px}
.adbox .in{padding:16px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:10px 0 14px}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width 1s linear}
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:150px}
.msg{max-width:86%;overflow-wrap:anywhere;padding:11px 14px;border-radius:18px;line-height:1.55;font-size:14.5px;white-space:pre-line}
.msg.me{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.msg.bot .btn{margin-top:8px}
.composer{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:24;background:var(--bg);padding:8px 16px 10px;border-top:1px solid var(--line)}
#aiBox{position:fixed;right:16px;bottom:calc(140px + env(safe-area-inset-bottom));width:380px;height:min(560px,calc(100dvh - 210px));z-index:40;display:flex;flex-direction:column;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 16px 48px rgba(20,25,40,.25);transform-origin:bottom right;animation:pop .22s cubic-bezier(.2,.8,.2,1)}
#aiBox .aihd{display:flex;align-items:center;gap:10px;padding:14px 10px 14px 16px;background:linear-gradient(135deg,#3b5bfd,#8b5cf6);color:#fff}
#aiBox .aiav{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
#aiBox .chat{flex:1;overflow:auto;padding:14px 14px 8px;background:var(--bg)}
#aiBox .aift{padding:10px 12px 12px;border-top:1px solid var(--line)}
@keyframes pop{from{opacity:0;transform:scale(.5) translateY(30px)}}
.fab.open{width:52px;padding:0;justify-content:center;font-size:20px}
@media (max-width:899px){#aiBox{left:12px;right:12px;width:auto}}
@media (min-width:900px){#aiBox{right:max(16px,calc(50% - 470px))}}
.composer .in{max-width:760px;margin:0 auto}
.kakao{background:#b2c7da;border-radius:14px;padding:12px}
.kakao .bub{background:#fff;border-radius:12px;overflow:hidden;color:#111;font-size:13.5px;max-width:270px}
.kakao .bub .h{background:var(--kakao);padding:9px 12px;font-weight:800}
.kakao .bub .b{padding:12px;white-space:pre-line;line-height:1.55}
.sms{background:#e9e9eb;color:#111;border-radius:16px;padding:10px 13px;font-size:13.5px;white-space:pre-line;max-width:270px;line-height:1.5}
.sched{display:flex;gap:12px;align-items:flex-start}
.sched .t{font-size:22px;font-weight:800;line-height:1.2}
.menu-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.menu-row:last-child{border-bottom:0}
.listlink{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-weight:600}
.listlink:last-child{border-bottom:0}
.listlink .ico{width:34px;height:34px;border-radius:10px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;flex:none}
table.plan{width:100%;border-collapse:collapse;font-size:13px}
table.plan th,table.plan td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:center}
table.plan td:first-child,table.plan th:first-child{text-align:left;color:var(--sub)}
table.plan td:not(:first-child),table.plan th .tiny{white-space:nowrap}table.plan td .tiny{white-space:normal}table.plan td:first-child{min-width:92px}
.tw{overflow-x:auto;margin:0 -2px}
.dtable{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.dtable th{color:var(--sub);font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);font-size:12px}
.dtable td{padding:10px 8px;border-bottom:1px solid var(--line)}
.dtable tr:last-child td{border-bottom:0}
.rlist{border-collapse:separate;border-spacing:0;font-size:13px;white-space:nowrap;width:100%}
.rlist th,.rlist td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
.rlist th{color:var(--sub);font-weight:600;font-size:11.5px;background:var(--card);position:sticky;top:0}
.rlist .kc{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;max-width:190px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line)}
.rlist tbody tr{cursor:pointer}.rlist tbody tr:hover td{filter:brightness(.97)}
.rlist td.u{background:color-mix(in srgb,var(--up) 13%,var(--card))}.rlist td.d{background:color-mix(in srgb,var(--down) 13%,var(--card))}
.rlist td small{display:block;font-size:10.5px;color:var(--sub);line-height:1.2}
.ctip{position:absolute;transform:translate(-50%,calc(-100% - 12px));background:var(--card);border:1px solid var(--line);box-shadow:0 4px 14px rgba(20,25,40,.12);border-radius:10px;padding:6px 10px;font-size:13px;pointer-events:none;white-space:nowrap;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;width:max-content;max-width:220px}
.ctip.below{transform:translate(-50%,12px)}.ctip b{font-size:14px}.ctip div{flex-basis:100%;white-space:normal}
.rlseg button{white-space:nowrap;padding:0 10px}
@media(max-width:700px){.rlist .kc{max-width:118px}.rlist th,.rlist td{padding:7px 7px}}
.bar2{display:inline-block;width:90px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;vertical-align:middle}
.bar2 i{display:block;height:100%;border-radius:3px}
.mt{display:inline-flex;gap:8px;flex-wrap:nowrap}
.notice-board{overflow:hidden}
.nb-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.nb-title-wrap{display:flex;align-items:center;gap:8px;min-width:0}.nbic{color:var(--pri);display:grid}
.nb-title{font-size:14px;font-weight:700}.nb-sub{font-size:11px;color:var(--sub);margin-top:2px}
.nb-head-right{display:flex;align-items:center;gap:8px;flex-shrink:0}.nb-updated{font-size:10.5px;color:var(--sub);white-space:nowrap}
.nb-list{max-height:360px;overflow-y:auto}.nb-empty{padding:24px 18px;font-size:12.5px;color:var(--sub);text-align:center}
.nb-item{display:flex;align-items:center;gap:10px;padding:9px 18px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line)}
.nb-item:last-child{border-bottom:none}.nb-item:hover{background:var(--pri-soft)}
.nb-src{flex-shrink:0;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:5px;white-space:nowrap}
.nb-src.srch{color:#f2611c;background:rgba(242,97,28,.1)}.nb-src.blog{color:#0f9d8f;background:rgba(15,157,143,.1)}.nb-src.wwwpc{color:#16234f;background:rgba(22,35,79,.08)}
.nb-src.smartplace{color:#2db400;background:rgba(45,180,0,.1)}.nb-src.cafe{color:#8e24aa;background:rgba(142,36,170,.1)}.nb-src.help{color:#5c6bc0;background:rgba(92,107,192,.1)}
[data-theme=dark] .nb-src.wwwpc{color:#9fb0ff;background:rgba(159,176,255,.12)}
.nb-title-text{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-new{width:6px;height:6px;border-radius:50%;background:#f2611c;flex-shrink:0}.nb-date{flex-shrink:0;font-size:11px;color:var(--sub)}
.nb-refresh-btn{display:grid;place-items:center;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);color:var(--sub)}
@media (max-width:480px){.nb-title-text{font-size:12.5px}.nb-src{font-size:9.5px;padding:2px 6px}}
.tb .btn.sm{height:34px;padding:0 8px;font-size:12.5px;gap:3px;flex:none}
@media(max-width:380px){.tb .btn.sm svg{display:none}}
.dropzone{display:block;border:2px dashed var(--line);border-radius:14px;padding:34px 16px;text-align:center;cursor:pointer}
.dropzone:hover,.dropzone.drag{border-color:var(--pri);background:var(--pri-soft)}
.how{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.how summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--pri)}
.how-t{font-size:13px;font-weight:800;margin:12px 0 4px}
.how ul,.how ol{margin:0;padding-left:20px;font-size:13px;line-height:1.75;color:var(--sub)}
.dhandle{cursor:grab;color:var(--sub);touch-action:none;display:grid;place-items:center;padding:4px;margin:-4px 0}
.drow.dragging{background:var(--pri-soft);border-radius:12px;box-shadow:var(--shadow);opacity:.95}
.lnk{color:var(--pri);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}.cal b{color:var(--sub);font-weight:600;padding:4px 0}
.cal span{padding:7px 0;border-radius:8px}.cal .on{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);font-weight:700}.cal .off{background:color-mix(in srgb,var(--up) 12%,transparent);color:var(--up)}.cal .fut{color:var(--sub);opacity:.5}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px}.lg.on{background:color-mix(in srgb,var(--ok) 40%,transparent)}.lg.off{background:color-mix(in srgb,var(--up) 30%,transparent)}
.mchk{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}.mchk label{display:flex;align-items:center;gap:6px;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.mchk.one{grid-template-columns:1fr 1fr}
.mvbar{width:66px;flex:none;text-align:right}.mvbar .bar2{width:60px}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:8px}.bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bars span{width:100%;background:var(--pri);border-radius:4px 4px 0 0;opacity:.85}.bars i{font-style:normal;font-size:10px;color:var(--sub);margin-top:3px}
.kme{background:var(--kakao);color:#111;border-radius:12px;padding:8px 12px;margin:0 0 8px auto;max-width:70%;width:fit-content;font-size:13.5px}

function chart(it){

/* --- 홈: 변동 큰 키워드 ---
   내 등록 키워드가 아니라 전체 이용자가 등록한 키워드(서비스 공용 수집 데이터) 중 어제 대비 상위 업체 순위가 크게 흔들린 키워드.
   변동 점수 = 상위 20위 업체들의 |어제 순위 − 오늘 순위| 합 + 신규 진입·이탈 업체 × 10 (예시 데이터, 날짜마다 바뀜) */
const HOT_KW=[['강남 맛집','place'],['홍대 맛집','place'],['성수 카페','place'],['해운대 맛집','place'],['강남역 피부과','place'],['제주 숙소','place'],['판교 회식','place'],['을지로 맛집','place'],
  ['캠핑의자','shop'],['무선청소기','shop'],['가습기','shop'],['전기요','shop'],['에어프라이어','shop'],['패딩 조끼','shop'],['텀블러','shop'],['로봇청소기','shop']];
let MV='place'; // 변동 큰 키워드: 플레이스/쇼핑 탭
function volData(kw,type){const day=new Date().toDateString(),r=rng('vol'+kw+day);
  let rows=type==='shop'?CFG.s_compare.run({kw,base:'1일전',n:'상위 20개'}).rows.map(x=>({name:x.name,rank:x.rank,prev:x.prev,meta:`${fmtN(x.price)}원 · ${x.mall}`}))
    :type==='blog'?Array.from({length:20},(_,i)=>{const b=pick(r,BLOGGERS);return {name:`${kw} ${pick(r,BLOG_T)}`,rank:i+1,prev:Math.max(1,i+1+Math.round((r()-.5)*14)),meta:b[0]}})
    :genPlaces(kw,20,day).map(x=>({name:x.name,rank:x.rank,prev:x.prev,meta:`${x.cat} · 방 ${fmtN(x.rv)}`}));
  // 어제 순위 = 오늘 순위에 흔들림을 준 뒤 다시 줄 세운 순서(겹치지 않게). 어제 20위 밖이었던 곳은 신규 진입, 오늘 20위 밖으로 밀린 곳은 이탈
  let out=Array.from({length:Math.floor(r()*3)},(_,i)=>({name:type==='place'?placeName(r):`${kw} ${pick(r,['추천','후기','BEST'])} ${i+1}`,key:r()*14+1,out:1}));
  const pool=[...rows.map(x=>({x,key:r()<.12?25+r()*10:x.rank+(r()-.5)*9})),...out.map(o=>({x:o,key:o.key}))].sort((a,b)=>a.key-b.key);
  pool.forEach((p,i)=>{p.x.prev=i<20?i+1:null});out=out.filter(o=>o.prev!=null); // 어제도 20위 밖이었으면 이탈 아님
  const moved=rows.filter(x=>x.prev!=null&&x.prev!==x.rank),newIn=rows.filter(x=>x.prev==null);
  const score=rows.reduce((s,x)=>s+(x.prev==null?10:Math.abs(x.prev-x.rank)),0)+out.length*10;
  return {kw,type,rows,out,moved:moved.length,newIn:newIn.length,avg:moved.length?(moved.reduce((s,x)=>s+Math.abs(x.prev-x.rank),0)/moved.length).toFixed(1):'0',score,users:Math.floor(r()*900+40)}}
function moversCard(){const list=HOT_KW.filter(x=>x[1]===MV).map(([k,t])=>volData(k,t)).sort((a,b)=>b.score-a.score).slice(0,5),max=list[0].score;
  return `<div class="card"><h3>변동 큰 키워드<span class="more">전체 이용자 데이터 · 어제 대비</span></h3>
    <div class="seg" style="margin-bottom:8px">${[['place','N 플레이스'],['shop','N 쇼핑']].map(([t,l])=>`<button class="${MV===t?'on':''}" onclick="MV='${t}';render()">${l}</button>`).join('')}</div>
    ${list.map((v,i)=>`<div class="list-row" style="cursor:pointer" onclick="volSheet('${v.kw}','${v.type}')"><span class="num">${i+1}</span>
      <div class="grow"><b>${esc(v.kw)}</b>
        <div class="tiny muted" style="margin-top:3px">상위 20위 중 ${v.moved}곳 변동 · 평균 ±${v.avg}위 · 신규 진입 ${v.newIn} · 이탈 ${v.out.length}</div></div>
      <div class="mvbar">${BAR(Math.round(v.score/max*100),'var(--up)')}<div class="tiny muted">${v.users}명 추적</div></div></div>`).join('')}
    <div class="tiny muted" style="margin-top:8px">키워드를 누르면 어제와 오늘의 상위 순위를 비교해요.${S.plan==='free'?' 🔒 순위 비교표는 PRO부터 보여요.':''}</div></div>`}
function volSheet(kw,type){const v=volData(kw,type);
  sheet(`<div class="row"><span class="tag ${type}">${TYPES[type].t}</span><span class="tiny muted">어제 vs 오늘 · 상위 20위</span></div><h2>${esc(kw)}</h2>
    ${K([['순위 바뀐 곳',v.moved+'곳'],['평균 변동','±'+v.avg+'위'],['신규 진입',v.newIn+'곳'],['이탈',v.out.length+'곳']])}
    ${S.plan==='free'?`<div style="position:relative;margin-top:12px;min-height:260px"><div class="card lockpop"><b>🔒 어제·오늘 순위 비교표는 PRO부터 보여요</b><div class="small muted" style="margin:4px 0 10px">어떤 업체가 오르고 내렸는지, 새로 들어오고 밀려난 곳을 한눈에 볼 수 있어요.</div><button class="btn sm" onclick="closeSheet();go('plan')">요금제 보기</button></div><div aria-hidden="true" style="filter:blur(3px);opacity:.55;pointer-events:none;user-select:none;max-height:420px;overflow:hidden">`:'<div>'}
    ${T(['오늘','어제','변동',type==='place'?'업체':type==='shop'?'상품':'글','정보'],v.rows.map(x=>[`<b>${x.rank}</b>`,x.prev??'-',x.prev==null?'<span class="tag" style="background:rgba(59,91,253,.12);color:var(--pri)">NEW</span>':dlt(x.rank,x.prev),esc(x.name),`<span class="tiny muted">${esc(x.meta)}</span>`]))}
    ${v.out.length?`<h3 style="font-size:15px;margin:14px 0 4px">20위 밖으로 밀려난 곳</h3>${T(['어제','이름'],v.out.map(x=>[x.prev+'위',esc(x.name)]))}`:''}</div>${S.plan==='free'?'</div>':''}
    ${S.plan==='free'?'':`<button class="btn sub block" style="margin-top:14px" onclick="AN.${type==='shop'?'s_compare':'p_compare'}={v:{kw:'${esc(kw)}',base:'1일전',n:'상위 20개'},res:null};closeSheet();go('m','${type==='shop'?'s_compare':'p_compare'}')">${type==='shop'?'가격비교 비교분석':'순위 비교분석'}에서 자세히 보기</button>`}`)}

function parseUrl(t){
  let m;const pick=(type,mid)=>({type,typeName:TYPES[type].t,mid,name:NAMES[type][hash(mid)%NAMES[type].length]});
  if(m=t.match(/(?:place\.naver\.com\/(?:\w+\/)?|map\.naver\.com\/\S*?place\/)(\d{5,})/))return pick('place',m[1]);
  if(m=t.match(/(?:smartstore|brand)\.naver\.com\/[\w-]+\/products\/(\d+)|shopping\.naver\.com\/\S*?catalog\/(\d+)/))return pick('shop',m[1]||m[2]);
  if(m=t.match(/blog\.naver\.com\/([\w-]+)\/(\d+)/))return pick('blog',m[2]);
  if(/^\d{7,}$/.test(t.trim()))return pick('place',t.trim());
  return null}

function makeSchedule(t,hit){
  let times=[];const ev=t.match(/(\d+)\s*시간\s*마다/);
  if(ev)for(let h=9;h<=21;h+=+ev[1])times.push(pad(h)+':00');
  else for(const m of t.matchAll(/(오전|오후|저녁|밤)?\s*(\d{1,2})\s*시\s*(?:(\d{1,2})\s*분|(반))?/g)){let h=+m[2];if(/오후|저녁|밤/.test(m[1]||'')&&h<12)h+=12;if(h<24)times.push(pad(h)+':'+(m[3]?pad(m[3]):m[4]?'30':'00'))}
  times=[...new Set(times)].sort();
  const days=/평일/.test(t)?[1,2,3,4,5]:/주말/.test(t)?[0,6]:[0,1,2,3,4,5,6];
  const th=t.match(/(\d+)\s*위\s*(밖|아래|이하|밑)/);
  const cond=th?'out':/떨어|하락/.test(t)?'drop':/변동|바뀌|변하/.test(t)?'change':'always';
  const type=/플레이스/.test(t)?'place':/쇼핑|스토어/.test(t)?'shop':/블로그/.test(t)?'blog':'all';
  const ch={push:true,kakao:/카톡|카카오/.test(t),sms:/문자|sms/i.test(t)};
  const s={id:uid(),name:hit.length?hit[0].keyword+' 알림':(type==='all'?'순위':TYPES[type].t)+' 알림',type:hit.length?'all':type,ids:hit.map(i=>i.id),times,days,cond,th:th?+th[1]:10,ch,on:true};
  S.schedules.push(s);
  const miss=['kakao','sms'].filter(k=>ch[k]&&!S.ch[k]);
  return `⏰ 알림을 예약했어요\n\n• 시간: ${times.join(', ')} (${days.length===7?'매일':days.length===5?'평일':'주말'})\n• 대상: ${hit.length?hit.map(i=>esc(i.keyword)).join(', '):(type==='all'?'전체 키워드':TYPES[type].t)}\n• 조건: ${cond==='out'?s.th+'위 밖으로 밀리면':COND[cond]}\n• 받는 곳: ${chLabel(s).join(', ')}\n\n미리보기:\n<span class="small muted">${esc(msgFor(s)||'(현재는 조건에 맞는 변동 없음)').split('\n').slice(0,3).join('\n')}</span>`+
    (miss.length?`\n\n⚠️ ${miss.map(k=>k==='kakao'?'카카오톡':'문자').join('·')} 번호가 아직 연결되지 않았어요.\n<button class="btn sm" onclick="go('channels')">받는 곳 연결하기</button>`:`\n<button class="btn sub sm" onclick="go('alert')">알림 예약 보기</button>`)}
function recommend(t,hit){
  const base=hit[0]||S.items.find(i=>i.type==='place'),word=(t.match(/([가-힣]+?)(?:\s*(?:키워드|지역))?\s*(?:관련\s*)?추천/)||[])[1];
  const region=(word&&!/키워드|추천/.test(word)?word:null)||(base?base.keyword.split(' ')[0]:'강남');
  const suf=['맛집','데이트','회식','점심','술집','가볼만한곳','브런치','고기집'];
  RECO=suf.map(s=>({kw:region+' '+s,vol:(hash(region+s)%80+3)*610,comp:['낮음','보통','높음'][hash(s+region)%3]})).sort((a,b)=>b.vol-a.vol).slice(0,6);
  return `🔎 <b>${esc(region)}</b> 연관 키워드 추천 (월 검색량순)\n\n`+RECO.map((r,i)=>`${i+1}. ${esc(r.kw)} · ${fmtN(r.vol)}회 · 경쟁 ${r.comp}`).join('\n')+
    (base?`\n\n<b>${esc(base.name)}</b>로 추적할 키워드를 눌러보세요:\n`+RECO.map((r,i)=>`<button class="chip" style="margin:3px 2px 0 0" onclick="addReco(${i},'${base.id}',this)">+ ${esc(r.kw)}</button>`).join(''):'')}
function addReco(i,bid,el){const b=S.items.find(x=>x.id===bid),r=RECO[i];if(!b||!r)return;

  sel.forEach(e=>{if(!S.items.some(i=>i.type===type&&i.keyword===e.dataset.kw&&i.name===(e.dataset.name||kw)))S.items.unshift(mkItem(type,e.dataset.kw,e.dataset.name||kw,String(hash(e.dataset.name||kw)).slice(0,10),+e.dataset.rank||fakeRank(type,e.dataset.kw,kw),'기본'))});
  toast(`${sel.length}개 키워드를 추적 등록했어요`)}
const allChk=`<input type="checkbox" onclick="document.querySelectorAll('#anRes input.sel').forEach(e=>e.checked=this.checked)">`;

/* ── 가짜 엔진: 입력값 해시 기반이라 같은 입력이면 같은 결과 ── */
function genVolume(kw){const r=rng('vol'+kw),pc=Math.round(r()*9000+200),mo=Math.round(pc*(2+r()*5));
  return {kw,pc,mo,sum:pc+mo,cpc:+(pc*(.002+r()*.02)).toFixed(1),cmo:+(mo*(.004+r()*.03)).toFixed(1),comp:pick(r,['낮음','중간','높음'])}}
function genPlaces(kw,n,seedExtra=''){const r=rng('pl'+kw+seedExtra),out=[];const mine=S.items.filter(i=>i.type==='place'&&i.keyword===kw);
  for(let i=1;i<=n;i++){const m=mine.find(x=>cur(x)===i);
    out.push(m?{rank:i,name:m.name,me:true,cat:m.cat,rv:m.rv,bl:m.bl,sv:m.sv,prev:prv(m),addr:`서울 강남구 ${pick(r,STREETS)} ${Math.floor(r()*400+1)}`}
      :{rank:i,name:placeName(r),cat:pick(r,['소고기구이','돼지고기구이','한식','이탈리아음식','일식당','카페,디저트']),rv:Math.floor(r()*4000+50),bl:Math.floor(r()*1500+10),sv:Math.floor(r()*12000+100),
        prev:Math.max(1,i+Math.round((r()-.5)*6)),addr:`서울 강남구 ${pick(r,STREETS)} ${Math.floor(r()*400+1)}`})}
  return out}

  const r=rng('ch'+kw+name),days=14,hist=[];let x=rank;for(let i=0;i<days;i++){hist.unshift(x);x=Math.max(1,x+Math.round((r()-.5)*4))}
  const e=ext('place','',name),rv=mSeries('rv'+name,e.rv,e.grow[0],days),bl=mSeries('bl'+name,e.bl,e.grow[1],days),sv=mSeries('sv'+name,e.sv,e.grow[2],days),c=(a,i)=>fmtN(a[i])+(i?incTag(a[i],a[i-1]):''),rows=hist.map((v,i)=>[dayLabel(i,days),v+'위'+(i?rankTag(v,hist[i-1]):''),c(rv,i),c(bl,i),c(sv,i)]).reverse();
  sheet(`<h2>${esc(name)}</h2><div class="small muted">키워드 ${esc(kw)} · 최근 ${days}일 이력</div>
    <div class="card" style="box-shadow:none;border:1px solid var(--line);padding:12px 8px 6px;margin-top:12px">${chart({history:hist})}</div>
    ${rowsHtml([['카테고리',e.cat],['방문자리뷰',fmtN(e.rv)],['블로그리뷰',fmtN(e.bl)],['저장',fmtN(e.sv)]])}
    <h3 style="font-size:15px;margin:14px 0 4px">일별 기록</h3>${T(['날짜','순위','방문자리뷰','블로그리뷰','저장'],rows)}
    <button class="btn block" style="margin-top:14px" onclick="trackAdd('place','${esc(kw)}','${esc(name)}');closeSheet()">${ic('plus',16)} 이 업체 추적 등록</button>`)}
CFG.p_compare.view=(res,v,k)=>{const r=res.rows,avg=f=>fmtN(Math.round(r.reduce((s,x)=>s+x[f],0)/r.length));
  return `<div class="card"><h3>${esc(v.kw)} 상위 ${r.length}곳 <span class="more">${v.base} 대비</span></h3>
  ${K([['평균 방문자리뷰',avg('rv')],['평균 블로그리뷰',avg('bl')],['평균 저장',avg('sv')],['1위 방문자리뷰',fmtN(r[0].rv)]])}
  ${T(['순위','이력','상호명','카테고리','방문자리뷰','블로그리뷰','저장','주소',''],r.map(x=>[x.rank,dlt(x.rank,x.prev),`<a class="lnk" onclick="compHist('${esc(v.kw)}','${esc(x.name)}',${x.rank})">${x.me?ME(esc(x.name)):esc(x.name)}</a>`,x.cat,fmtN(x.rv),fmtN(x.bl),fmtN(x.sv),x.addr,
    x.me?'<span class="tag">추적 중</span>':`<button class="btn ghost sm" style="height:28px" onclick="trackAdd('place','${esc(v.kw)}','${esc(x.name)}')">추적</button>`]))}
  <div class="row" style="margin-top:12px">${xlsxBtn(k)}</div></div>`};
CFG.p_compare.guide=[...CFG.p_compare.guide,'업체 이름을 누르면 그 업체의 최근 14일 순위·리뷰·저장 이력을 볼 수 있어요.'];

/* 히든·상위 키워드: 자동 찾기 + 직접 입력(내 키워드만 순위 조회) */

Object.assign(CFG.p_hidden,{
  guide:['자동 찾기: 플레이스 URL만 넣으면 이 업체가 노출되는 숨은 키워드를 찾아줘요.','직접 입력: 키워드를 줄바꿈으로 넣고 URL·범위를 정하면 그 키워드들의 순위만 조회해요.','체크한 키워드는 한 번에 순위 추적으로 등록할 수 있어요.'],
  form:[{id:'mode',label:'방식',type:'select',opts:['자동 찾기','직접 입력'],def:'자동 찾기'},{id:'url',label:'플레이스 URL 또는 ID',ph:'https://m.place.naver.com/restaurant/1938472610',req:true,def:'https://m.place.naver.com/restaurant/1938472610'},
    {id:'kws',label:'키워드 (직접 입력일 때)',hint:'줄바꿈으로 최대 50개',type:'textarea',rows:3,def:'강남 맛집\n강남역 고기집\n역삼 회식\n선릉 갈비'},{id:'range',label:'범위',type:'select',opts:['5위 이내','10위 이내','20위 이내','30위 이내','50위 이내','100위 이내'],def:'20위 이내'}],
  run:v=>{const res=_hidRun(v);if(v.mode!=='직접 입력')return res;
    res.kws=v.kws.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,50).map(kw=>{const r=rng('hd'+kw+res.mid);const q=r();return {kw,rank:q<.12?999:q<.6?Math.floor(r()*20)+1:Math.floor(r()*100)+21,vol:genVolume(kw).sum,stores:Math.floor(r()*900+30)}});res.direct=true;return res},
  view:(res,v,k)=>{if(!res.direct)return _hidView(res,v,k);const lim=parseInt(v.range);
    return `<div class="card"><h3>${esc(res.name)} · 직접 입력 키워드 순위 <span class="more">${v.range}</span></h3>
    ${T([allChk,'키워드','순위','월 검색량','업체 수'],res.kws.map(x=>[`<input type="checkbox" class="sel" data-kw="${esc(x.kw)}" data-name="${esc(res.name)}" data-rank="${x.rank<999?x.rank:''}">`,esc(x.kw),`<b style="color:${x.rank<=lim?'var(--down)':'var(--up)'}">${x.rank<999?x.rank+'위':'순위 밖'}</b>`,fmtN(x.vol),fmtN(x.stores)]))}
    <div class="tiny muted" style="margin-top:6px"><b style="color:var(--down)">파란색</b> = ${v.range} 안 · <b style="color:var(--up)">빨간색</b> = 범위 밖</div>
    <div class="row" style="margin-top:12px;gap:6px">${xlsxBtn(k)}<button class="btn sm" onclick="trackChecked('place','${esc(res.name)}')">선택 키워드 추적 등록</button></div></div>`}});
LOGIC.p_hidden=[...LOGIC.p_hidden,'직접 입력: 사용자가 넣은 키워드만 하나씩 플레이스 검색을 돌려 이 업체의 순위를 찾고, 범위 안이면 파란색·밖이면 빨간색으로 표시해요.'];

/* 블로그 지수 분석: 조회한 블로그를 매일 추적 */

CFG.b_level.view=(res,v,k)=>_blView(res,v,k).replace('<div class="card"><h3>최근 글 노출</h3>',`<div class="card"><button class="btn sub block" onclick="blogTrack('${esc(res.info.id)}')">${ic('plus',16)} 이 블로그 매일 추적</button></div><div class="card"><h3>최근 글 노출</h3>`)+
  (MG.blogs.length?`<div class="card"><h3>매일 추적 중인 블로그 <span class="more">${MG.blogs.length}개</span></h3>${T(['블로그ID','지수','방문자(어제→오늘)','이웃','최근 글 노출률','등록일',''],MG.blogs.map((b,i)=>{const r=rng('bt'+b.id),y=Math.floor(r()*3000+100),t=y+Math.round((r()-.4)*300);
    return [esc(b.id),b.grade,`${fmtN(y)} → <b>${fmtN(t)}</b>`,fmtN(b.nb),Math.floor(r()*40+60)+'%',b.at,`<button class="btn ghost sm" style="height:28px" onclick="MG.blogs.splice(${i},1);render()">해제</button>`]}))}</div>`:'');
// 예시 자동완성 목록(같은 키워드면 같은 결과, 7개 중 1개꼴로 자동완성 없음)
function acList(q){const h=Math.abs(hash(q)),sfx=['추천','맛집','후기','가격','근처','예약','주차','데이트','가성비','내돈내산','웨이팅','메뉴'],n=h%7===0?0:4+h%7;
  return Array.from({length:n},(_,i)=>q+' '+sfx[(h+i*5)%sfx.length])}
function acCopy(){navigator.clipboard.writeText(CFG.k_auto.csv(AN.k_auto.res).map(r=>r.join('\t')).join('\n')).then(()=>toast('결과를 복사했어요. 엑셀에 바로 붙여넣으세요'))}
function relWatch(b){const kw=AN.k_related.res.kw;const a=[...b.closest('.card').querySelectorAll('.sel:checked')].map(e=>e.dataset.kw).filter(x=>!MG.relW.some(w=>w.rel===x));
  if(!a.length)return toast('새로 넣을 연관검색어를 체크해주세요');MG.relW.unshift(...a.map(rel=>({rel,kw,at:fmtD(new Date())})));render();toast(a.length+'개를 매일 노출 체크해요')}
function blogTrack(id){if(MG.blogs.some(b=>b.id===id))return toast('이미 매일 추적 중이에요');const i=AN.b_level.res.hist.find(h=>h.id===id);MG.blogs.unshift({id,grade:i.grade,nb:i.nb,at:fmtD(new Date())});render();toast('매일 추적을 시작했어요')}
LOGIC.b_level=[...LOGIC.b_level,'매일 추적: 등록한 블로그는 매일 같은 시각에 다시 읽어 방문자·이웃·지수 변화와 최근 글 노출률을 기록해요.'];

/* 파워링크: 입찰가 조회 + 내 광고 순위 체크 */
const _pwRun=CFG.k_power.run,_pwView=CFG.k_power.view,_pwCsv=CFG.k_power.csv;
Object.assign(CFG.k_power,{

    {id:'area',label:'광고 영역 (순위 체크)',type:'select',opts:['PC','모바일'],def:'모바일'},{id:'gid',label:'광고그룹 ID 또는 출처명 (순위 체크)',ph:'예: nad-a001-01-000000 또는 홍길동숯불갈비',def:'홍길동숯불갈비'}],
  run:v=>v.mode==='순위 체크'?{rank:v.kw.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,10).map(kw=>{const r=rng('pr'+kw+v.gid+v.area),n=Math.floor(r()*8+3),p=r()<.2?0:Math.floor(r()*n)+1;return {kw,n,p,t:`${pad(9+Math.floor(r()*9))}:${pad(Math.floor(r()*60))}`}})}:_pwRun(v),
  view:(res,v,k)=>res.rank?`<div class="card"><h3>내 광고 순위 · ${v.area} <span class="more">${esc(v.gid)}</span></h3>${T(['키워드','내 광고 위치','노출 광고 수','확인 시각'],res.rank.map(x=>[`<b>${esc(x.kw)}</b>`,x.p?`<b>${x.p}번째</b>`:'<span class="down">미노출</span>',x.n+'개',x.t]))}
      <div class="tiny muted" style="margin-top:8px">미노출은 입찰가가 낮거나 광고 예산 소진·검토 중일 수 있어요.</div></div>`:_pwView(res,v,k),
  csv:(res,st)=>res.rank?[['키워드','내 광고 위치','노출 광고 수','확인 시각'],...res.rank.map(x=>[x.kw,x.p||'미노출',x.n,x.t])]:_pwCsv(res,st)});

/* 유입 통계: 네이버 스마트플레이스 연동 단계 */
/* 유입·플레이스 통계: 스마트플레이스 통계 > 리포트 화면 구성(방문 전·후 지표, 이번 주 vs 지난 주 유입, 유입 채널·키워드). 연동 전엔 연동 안내 */
const SR={sel:['홍길동 숯불갈비'],tab:'리포트',per:'주간',off:0,place:'홍길동 숯불갈비',inT:'채널'};
const WD='일월화수목금토',PW={일간:{a:'하루',prev:'어제',u:'시간'},주간:{a:'한 주',prev:'지난주',u:'일'},월간:{a:'한 달',prev:'지난달',u:'일'}};
function statsData(){const t=new Date();t.setHours(0,0,0,0);let st,en,labels,lastLen;
  if(SR.per==='일간'){st=new Date(t);st.setDate(t.getDate()-SR.off);en=st;labels=Array.from({length:24},(_,i)=>i+'시');lastLen=24}
  else if(SR.per==='주간'){st=new Date(t);st.setDate(t.getDate()-((t.getDay()+6)%7)-SR.off*7);en=new Date(st);en.setDate(st.getDate()+6);labels=[...'월화수목금토일'];lastLen=7}
  else{st=new Date(t.getFullYear(),t.getMonth()-SR.off,1);en=new Date(st.getFullYear(),st.getMonth()+1,0);labels=Array.from({length:en.getDate()},(_,i)=>String(i+1));lastLen=new Date(st.getFullYear(),st.getMonth(),0).getDate()}
  const shown=en>t?t:en,day=SR.per==='일간',el=day?(SR.off?24:new Date().getHours()+1):Math.round((shown-st)/864e5)+1,r=rng('sr'+SR.place+SR.per+st.toDateString()),base=day?2:SR.per==='주간'?28:24;
  const cur=Array.from({length:el},()=>Math.round(base*(.5+r()))),last=Array.from({length:lastLen},()=>Math.round(base*(.6+r()*1.4)));
  const sum=a=>a.reduce((x,y)=>x+y,0),ct=sum(cur),lt=sum(last.slice(0,Math.max(el,1)))||1,rv=Math.floor(r()*4),pct=Math.round((ct-lt)/lt*100);
  const ch=[['네이버지도',.6],['네이버검색',.4*.9],['플레이스 목록',.07],['블로그',.03]].map(([n,w])=>[n,Math.round(ct*w*(.8+r()*.4))]).sort((a,b)=>b[1]-a[1]);
  const kw=[SR.place.split(' ')[0],...SFX.slice(0,5).map(x=>'강남 '+x)].map((k,i)=>[k,Math.round(ct*(i?.25/(i+1):.35)*(.8+r()*.4))]).sort((a,b)=>b[1]-a[1]);
  const f=d=>`${String(d.getFullYear()).slice(2)}. ${d.getMonth()+1}. ${d.getDate()}. ${WD[d.getDay()]}`;
  return {range:day?f(st):`${f(st)} - ${f(shown).slice(4)}`,labels,cur,last,ct,lt:sum(last),avg:Math.round(ct/el),pct,rv,ch,kw,canNext:SR.off>0}}
function statsChart(d){const W=300,H=120,pl=22,pb=18,n=d.labels.length,mx=Math.ceil(Math.max(...d.cur,...d.last,10)/20)*20,x=i=>pl+i*(W-pl-6)/(n-1),y=v=>H-pb-v/mx*(H-pb-8);
  const line=(a,c,w)=>`<polyline fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round" points="${a.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`,lc=d.cur.length-1;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${[0,.33,.66,1].map(f=>`<line x1="${pl}" x2="${W-6}" y1="${y(mx*f)}" y2="${y(mx*f)}" stroke="var(--line)"/><text x="${pl-4}" y="${y(mx*f)+3}" font-size="7" text-anchor="end" fill="var(--sub)">${Math.round(mx*f)}</text>`).join('')}
    ${line(d.last,'#c7cbd4',1.5)}${line(d.cur,'#03c75a',2.2)}<circle cx="${x(lc)}" cy="${y(d.cur[lc])}" r="5" fill="#03c75a" stroke="#fff" stroke-width="2"/>
    ${d.labels.map((l,i)=>n<=7||i%5===0||i===n-1?`<text x="${x(i)}" y="${H-5}" font-size="7.5" text-anchor="${i===n-1?'end':i?'middle':'start'}" fill="var(--sub)">${l}</text>`:'').join('')}</svg>
    <div class="row tiny muted" style="justify-content:center;gap:14px"><span><i class="lg" style="background:#c7cbd4"></i> ${PW[SR.per].prev}</span><span><i class="lg" style="background:#03c75a"></i> ${{일간:'오늘',주간:'이번 주',월간:'이번 달'}[SR.per]}</span></div>`}
function statsReport(){const d=statsData(),g='#03c75a',w=PW[SR.per],dl=d.pct<0?`<span class="down">↓${-d.pct}%</span>`:`<span class="up">↑${d.pct}%</span>`;
  const tile=(t,v,sub,x='')=>`<div class="stile"><div class="row"><span class="small grow" style="font-weight:600">${t} ${x}</span><b>${v}</b></div><div class="tiny muted" style="text-align:right">${sub}</div></div>`;
  const list=SR.inT==='채널'?d.ch:d.kw;
  const tabs=['리포트','플레이스','스마트콜','예약·주문','리뷰','플레이스 광고'];
  const body=SR.tab==='리포트'?`
    <div class="card"><h3>방문 전 지표 <span style="color:${g}">3</span></h3><div class="sgrid">
      ${tile('플레이스 유입',`${d.ct}<small>회</small>`,`${w.prev} ${d.lt}회`,dl)}${tile('예약·주문 신청','0<small>회</small>',`${w.prev} -회`,'-')}
      <div class="stile"><div class="row"><span class="small grow" style="font-weight:600">스마트콜 통화</span><a class="lnk" style="color:${g};font-weight:700" onclick="toast('스마트콜 연결 안내 (예시)')">연결하기</a></div><div class="tiny muted" style="text-align:right">상세한 통화 분석이 궁금하다면?</div></div></div>
      <h3 style="margin-top:16px">방문 후 지표 <span style="color:${g}">1</span></h3><div class="sgrid">${tile('리뷰 등록',`${d.rv}<small>회</small>`,`${w.prev} -회`,'-')}</div></div>
    <div class="sgrid2">
      <div class="card"><div class="shd">${w.a} <span style="color:${g}">리뷰</span>는 ${d.rv}회,<br>${w.u} 평균 ${(d.rv/d.cur.length).toFixed(0)}회 입니다.</div><div class="tiny muted">비교할 데이터가 없습니다.</div>
        <div class="empty" style="padding:30px 0"><div style="font-size:40px">📊</div><div class="small">조회 기간에 수집된 데이터가 없습니다.<br>조회 기간을 더 길게 설정해보세요.</div></div></div>
      <div class="card"><div class="shd">${w.a} <span style="color:${g}">플레이스 유입</span>은 ${d.ct}회,<br>${w.u} 평균 ${d.avg}회 입니다.</div><div class="tiny muted">${w.prev} 대비 유입 수가 ${d.pct<0?`<b class="down">${d.pct}% 감소</b>`:`<b class="up">+${d.pct}% 증가</b>`} 했습니다.</div>

      <div class="row" style="margin-bottom:8px;gap:6px;flex-wrap:wrap"><label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" onclick="document.querySelectorAll('.cmbk').forEach(e=>e.checked=this.checked)"> 전체 선택</label><span class="grow"></span>

function cmbRun(){const c=TL.cmb,g=c.w.map((w,i)=>({d:w.split('\n').map(s=>s.trim()).filter(Boolean),must:c.must[i],pos:c.pos[i]}));const pool=[];
  const build=(i,cur)=>{if(i===4){if(g.some((x,j)=>x.must&&!cur.some(c=>c.gid===j))||!cur.length)return;const res=Array(cur.length).fill(null),flex=[];
      cur.forEach(it=>{const p=g[it.gid].pos;p!=='any'&&+p<res.length?res[+p]=it.v:flex.push(it.v)});for(let k=0;k<res.length;k++)if(!res[k])res[k]=flex.shift();pool.push(res.join(' '));return}

    if(over&&over!==row&&over.parentNode===list){const r=over.getBoundingClientRect();list.insertBefore(row,ev.clientY<r.top+r.height/2?over:over.nextSibling)}};
  const end=()=>{removeEventListener('pointermove',move);removeEventListener('pointerup',end);removeEventListener('pointercancel',end);
    const order=[...list.children].filter(el=>el.dataset.i!=null).map(el=>+el.dataset.i),[o,key]=list.dataset.grp?[TREE.find(g=>g.k===list.dataset.grp),'items']:[S,list.dataset.arr]; // 하위 메뉴는 TREE 그룹 순서 자체를 바꿈

    <button class="btn block" style="margin-top:16px" onclick="closeSheet()">확인</button>`)}
/* --- 새 버전 배포 감지 (하이어애드 어드민과 같은 방식) ---
   GitHub Pages는 배포 때마다 Last-Modified가 배포 시각으로 바뀜 → 지금 화면보다 새로우면 아무 곳이나 누를 때 새로고침 안내
   Pages CDN 캐시(10분)를 건너뛰려고 확인·새로고침 모두 ?v=시각을 붙임
   업데이트 내용 = update-notes.json [{at:'YYYY-MM-DDTHH:MM'(KST), text}] 중 지금 화면 배포 이후 것만 팝업에 표시 */
const loadedAt=Date.parse(document.lastModified);
let lastCheck=0,outdated=false,changes=[];
async function checkVersion(){
  if(outdated||Date.now()-lastCheck<60000||!location.protocol.startsWith('http'))return;
  lastCheck=Date.now();
  try{const r=await fetch(`index.html?v=${Date.now()}`,{method:'HEAD',cache:'no-store'});outdated=Date.parse(r.headers.get('Last-Modified'))>loadedAt;
    if(outdated)changes=(await (await fetch(`update-notes.json?v=${Date.now()}`,{cache:'no-store'})).json()).filter(n=>Date.parse(n.at+':00+09:00')>loadedAt).map(n=>n.text)}catch(e){}}
function showReloadNotice(){
  if($('#reload-notice'))return;
  const el=document.createElement('div');el.id='reload-notice';el.className='adwrap';
  el.innerHTML=`<div class="adbox" style="padding:26px 22px"><div style="font-size:18px;font-weight:800">새 버전이 나왔어요</div>
    <div class="small muted" style="margin:8px 0 14px">최신 기능을 쓰려면 새로고침해 주세요.</div>
    ${changes.length?`<ul class="small" style="text-align:left;margin:0 0 16px;padding:12px 12px 12px 30px;background:var(--bg);border-radius:12px;max-height:200px;overflow:auto;line-height:1.7">${changes.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}
    <button class="btn block" onclick="location.replace(location.pathname+'?v='+Date.now()+location.hash)">새로고침</button></div>`;
  document.body.append(el)}
// 새 버전이면 어떤 클릭이든 막고 안내 — 새로고침 버튼만 통과
document.addEventListener('click',e=>{
  if(outdated&&!e.target.closest('#reload-notice')){e.stopPropagation();e.preventDefault();showReloadNotice()}
  else checkVersion()},true);
setInterval(checkVersion,5*60000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

S.menus=Object.keys(MENUS).map(k=>({k,on:true}));
// 예시: 목표 순위(달성·이탈 각각)와 작업 메모가 보이도록
S.items[0].goal=3;S.items[1].goal=3;S.items[0].wnotes=[{i:20,t:'대표 사진 교체'},{i:26,t:'리뷰 이벤트 시작'}];
{const [r,s]=location.hash.slice(2).split('/');route=r||'home';sub=s||''}
render();
</script>
